<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>產生圖示</title>
<style>
  body { font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; background: #f3f3f3; margin: 24px; color: #222; }
  h1 { font-size: 20px; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
  figure { margin: 0; text-align: center; font-size: 13px; }
  canvas { background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0 / 16px 16px; border-radius: 8px; }
  a { display: inline-block; margin-top: 6px; }
  p { max-width: 640px; line-height: 1.5; }
</style>
</head>
<body>
<h1>接龍合集圖示產生器</h1>
<p>用瀏覽器開這個檔案，下面每張圖點「下載」存到 <code>icons/</code> 資料夾即可。
   <b>icon-180</b> 給 iPhone 主畫面（滿版、不透明，iOS 會自己裁圓角）；
   <b>icon-192 / 512</b> 給 Android 與桌面（圓角、四角透明）；
   <b>icon-maskable-512</b> 給 Android 自適應圖示（滿版，內容縮在中央安全區）。</p>
<div class="row" id="out"></div>

<script>
// 圖示：深綠桌面上一張藍色牌背與一張紅心 A
function iconSvg(size, variant) {
  // variant: 'rounded'（圓角透明）| 'full'（滿版）| 'maskable'（滿版、內容縮小）
  const rounded = variant === 'rounded';
  const scale = variant === 'maskable' ? 0.78 : 0.9;
  const bgShape = rounded
    ? `<rect width="512" height="512" rx="112" fill="url(#bg)"/>`
    : `<rect width="512" height="512" fill="url(#bg)"/>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7d4f"/><stop offset="1" stop-color="#1a4a2e"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a6fd0"/><stop offset="1" stop-color="#22488f"/>
    </linearGradient>
    <pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="14" fill="rgba(255,255,255,0.16)"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  ${bgShape}
  <g transform="translate(256 262) scale(${scale}) translate(-256 -262)">
    <!-- 牌背 -->
    <g transform="rotate(-16 256 262)" filter="url(#shadow)">
      <rect x="150" y="106" width="212" height="304" rx="22" fill="#fff"/>
      <rect x="164" y="120" width="184" height="276" rx="14" fill="url(#back)"/>
      <rect x="164" y="120" width="184" height="276" rx="14" fill="url(#stripes)"/>
    </g>
    <!-- 紅心 A -->
    <g transform="rotate(10 256 262)" filter="url(#shadow)">
      <rect x="150" y="112" width="212" height="304" rx="22" fill="#fff"/>
      <text x="170" y="178" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="64" fill="#c8242c">A</text>
      <path transform="translate(256 268) scale(1.9)" fill="#c8242c"
        d="M0 34 C-30 14 -46 -1 -46 -18 C-46 -32 -35 -42 -23 -42 C-13 -42 -5 -36 0 -28 C5 -36 13 -42 23 -42 C35 -42 46 -32 46 -18 C46 -1 30 14 0 34 Z"/>
    </g>
  </g>
</svg>`;
}

const TARGETS = [
  { name: 'icon-180.png', size: 180, variant: 'full', note: 'iPhone 主畫面' },
  { name: 'icon-192.png', size: 192, variant: 'rounded', note: 'Android / 桌面' },
  { name: 'icon-512.png', size: 512, variant: 'rounded', note: 'Android / 桌面' },
  { name: 'icon-maskable-512.png', size: 512, variant: 'maskable', note: 'Android 自適應' },
];

async function render(t) {
  const svg = iconSvg(t.size, t.variant);
  const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  const img = new Image();
  await new Promise((ok, err) => { img.onload = ok; img.onerror = err; img.src = url; });
  const c = document.createElement('canvas');
  c.width = c.height = t.size;
  c.getContext('2d').drawImage(img, 0, 0, t.size, t.size);
  return c;
}

(async () => {
  const out = document.getElementById('out');
  window.__icons = {};
  // ?only=icon-512.png：只畫那一張、原始尺寸、透明背景，給無頭瀏覽器截圖用
  const only = new URLSearchParams(location.search).get('only');
  if (only) {
    const t = TARGETS.find((x) => x.name === only);
    document.body.innerHTML = '';
    document.body.style.cssText = 'margin:0;background:transparent;overflow:hidden';
    document.documentElement.style.background = 'transparent';
    const c = await render(t);
    c.style.cssText = 'display:block;background:none;border-radius:0';
    document.body.appendChild(c);
    window.__iconsReady = true;
    return;
  }
  for (const t of TARGETS) {
    const c = await render(t);
    const data = c.toDataURL('image/png');
    window.__icons[t.name] = data;
    const fig = document.createElement('figure');
    c.style.width = c.style.height = '128px';
    fig.appendChild(c);
    fig.insertAdjacentHTML('beforeend', `<figcaption>${t.name}<br>${t.note}<br><a download="${t.name}" href="${data}">下載</a></figcaption>`);
    out.appendChild(fig);
  }
  window.__icons['icon.svg'] = iconSvg(512, 'rounded');
  window.__iconsReady = true;
})();
</script>
</body>
</html>
